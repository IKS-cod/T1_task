spring:
  application:
    name: test-example
  datasource:
    url: jdbc:tc:postgresql:17.2:///test_db
    driverClassName: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  mail:
    host: smtp.yandex.ru
    port: 465
    protocol: smtps
    username:
    password:
    toEmail:
    fromEmail:
server:
  port: 8282

t1:
  scan-path: com.t1.task
  kafka:
    bootstrap:
      server: localhost:9092
    consumer:
      group-id: t1-demo
      mex.poll.records: 10
    producer:
      enable: true
    topic:
      task_update: t1_task_update
      client_id_registered: t1_demo_client_registered
    listener:
      poll-timeout: 1000

